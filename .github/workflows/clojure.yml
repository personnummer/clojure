name: Clojure CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: DeLaGuardo/setup-clojure@13.4
      with:
        lein: latest
    - name: Install dependencies
      run: lein deps
    - name: Run tests
      run: lein test
